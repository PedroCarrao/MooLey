<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MooLey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="geral">

        <!-- TELA DESLOGADA -->
        <div id="tela-deslogada" class="container-tela">
            <div class="navbar-deslogada">
                <h1 class="logo">MooLey</h1>
                <p class="explicacao">
                    Sua plataforma de desenvolvimento no basquete. Monitore seus treinos diários e acompanhe sua evolução física e técnica.
                </p>
            </div>
            <div class="conteudo-deslogado">
                <h2>Faça login para desbloquear os treinos</h2>
                <button id="btn-login-modal" class="login-btn">Faça Login</button>
            </div>
        </div>

        <!-- TELA LOGADA (Escondida por padrão) -->
        <div id="tela-logada" class="container-tela escondido">
            <div class="navbar-logada">
                <div class="perfil">
                    <div class="foto-perfil"></div>
                </div>
                <div class="info" id="info-jogador">
                    <!-- Preenchido via JavaScript -->
                </div>
                <div class="modos">
                    <button class="btn-modo active" data-tipo="salte+">salte+</button>
                    <button class="btn-modo" data-tipo="defenda+">defenda+</button>
                    <button class="btn-modo" data-tipo="ataque+">ataque+</button>
                </div>
            </div>

            <div class="area-treinos">
                <div class="semana">
                    <button class="btn-dia active" data-dia="Domingo">Domingo</button>
                    <button class="btn-dia" data-dia="Segunda">Segunda</button>
                    <button class="btn-dia" data-dia="Terca">Terça</button>
                    <button class="btn-dia" data-dia="Quarta">Quarta</button>
                    <button class="btn-dia" data-dia="Quinta">Quinta</button>
                    <button class="btn-dia" data-dia="Sexta">Sexta</button>
                    <button class="btn-dia" data-dia="Sabado">Sabado</button>
                </div>
                <div class="treino_diario">
                    <h3>Sequência de Treino</h3>
                    <div id="detalhes-treino">
                        <p>Selecione um dia da semana e um modo para visualizar o treino.</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- MODAL DE LOGIN SIMPLES -->
<div id="modal-login" class="modal escondido">
    <div class="modal-conteudo">
        <h3>Entrar na Plataforma</h3>
        <label for="input-nome-jogador">Nome do Jogador:</label>
        <input type="text" id="input-nome-jogador" placeholder="Ex: Luka Doncic" />
        
        <label for="input-altura-jogador">Altura (cm):</label>
        <input type="number" id="input-altura-jogador" placeholder="Ex: 201" />
        
        <button id="btn-confirmar-login">Entrar</button>
    </div>
</div>

<!-- MODAL DE EDIÇÃO DE PERFIL -->
<div id="modal-perfil" class="modal escondido">
    <div class="modal-perfil-conteudo">
        <button id="btn-voltar-perfil" class="btn-voltar">← Voltar</button>
        
        <div class="perfil-header">
            <div class="foto-perfil grande"></div>
            <h2>Editar Informações</h2>
        </div>

        <form id="form-editar-perfil" class="grid-inputs">
            <div class="campo grid-full">
                <label for="edit-foto-file">Escolher Foto de Perfil (do PC)</label>
                <input type="file" id="edit-foto-file" accept="image/*" />
            </div>
            <div class="campo">
                <label for="edit-nome">Nome</label>
                <input type="text" id="edit-nome" required />
            </div>

            <div class="campo">
                <label for="edit-altura">Altura (cm)</label>
                <input type="number" id="edit-altura" required />
            </div>

            <div class="campo">
                <label for="edit-idade">Idade</label>
                <input type="number" id="edit-idade" />
            </div>

            <div class="campo">
                <label for="edit-envergadura">Envergadura (cm)</label>
                <input type="number" id="edit-envergadura" />
            </div>

            <div class="campo">
                <label for="edit-al-ver">Alcance Vertical (cm)</label>
                <input type="number" id="edit-al-ver" />
            </div>

            <div class="campo">
                <label for="edit-posicao">Posição</label>
                <input type="text" id="edit-posicao" placeholder="Ex: Armador" />
            </div>

            <button type="submit" id="btn-salvar-perfil" class="btn-salvar">Alterar Info</button>
        </form>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
